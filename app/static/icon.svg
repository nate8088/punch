<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Card background -->
  <rect x="0" y="0" width="160" height="160" rx="34" fill="#d2c07a" stroke="#a89040" stroke-width="2"/>
  <!-- Notched corner -->
  <polygon points="0,0 28,0 0,28" fill="#c4b060"/>
  <line x1="0" y1="28" x2="28" y2="0" stroke="#a89040" stroke-width="1.5"/>

  <!-- Top hole row · − − · centered -->
  <!-- 4 holes, pitch 22, total 66px, start at (160-66)/2 = 47 -->
  <circle cx="47" cy="35" r="7" fill="white"/>
  <circle cx="69" cy="35" r="7" fill="none" stroke="#8a7840" stroke-width="2" opacity="0.7"/>
  <circle cx="91" cy="35" r="7" fill="none" stroke="#8a7840" stroke-width="2" opacity="0.7"/>
  <circle cx="113" cy="35" r="7" fill="white"/>

  <!-- Divider lines -->
  <line x1="12" y1="50" x2="148" y2="50" stroke="#8a7840" stroke-width="0.75" opacity="0.4"/>

  <!-- P centered -->
  <text x="80" y="108" font-family="'Courier New', monospace" font-size="56" font-weight="700" fill="#5a4a18" text-anchor="middle">P</text>

  <line x1="12" y1="120" x2="148" y2="120" stroke="#8a7840" stroke-width="0.75" opacity="0.4"/>

  <!-- Bottom hole row · − − · centered -->
  <circle cx="47" cy="135" r="7" fill="white"/>
  <circle cx="69" cy="135" r="7" fill="none" stroke="#8a7840" stroke-width="2" opacity="0.7"/>
  <circle cx="91" cy="135" r="7" fill="none" stroke="#8a7840" stroke-width="2" opacity="0.7"/>
  <circle cx="113" cy="135" r="7" fill="white"/>
</svg>
