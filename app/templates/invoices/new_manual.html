{% extends "base.html" %}
{% block title %}Manual Invoice — Punch{% endblock %}
{% block content %}

<div class="page-header">
  <div class="page-title">New Invoice</div>
  <a href="{{ url_for('invoices.index') }}" class="btn btn-ghost btn-sm">← Back</a>
</div>

<div class="card">
  <form method="POST">

    <div class="form-group">
      <label>Client *</label>
      <select name="client_id" required>
        <option value="">— select —</option>
        {% for c in clients %}
        <option value="{{ c.id }}">{{ c.name }}</option>
        {% endfor %}
      </select>
    </div>

    <hr class="divider">

    <div class="card-title">Line items</div>

    <div id="line-items-container">
      <div class="line-item-row" style="display:grid;grid-template-columns:1fr 80px 110px 90px 32px;gap:0.5rem;align-items:end;margin-bottom:0.75rem;">
        <div>
          <label>Description</label>
          <input type="text" name="item_description" placeholder="Service or project description" required>
        </div>
        <div>
          <label>Qty / Hrs</label>
          <input type="number" name="item_quantity" class="item-qty" min="0" step="0.25" value="1">
        </div>
        <div>
          <label>Unit price ($)</label>
          <input type="number" name="item_unit_price" class="item-price" min="0" step="0.01" placeholder="0.00">
        </div>
        <div>
          <label>Amount</label>
          <div class="item-total mono text-sm" style="padding:0.6rem 0;color:var(--accent);">$0.00</div>
        </div>
        <div style="padding-top:1.5rem;">
          <button type="button" class="remove-line-item btn btn-ghost btn-sm" style="color:var(--danger);">✕</button>
        </div>
      </div>
    </div>

    <button type="button" id="add-line-item" class="btn btn-secondary btn-sm mb-2">+ Add line item</button>

    <div style="text-align:right;font-size:1rem;font-weight:600;margin-bottom:1rem;">
      Total: <span id="invoice-total-display" class="mono text-accent">$0.00</span>
    </div>

    <hr class="divider">

    <div class="form-row">
      <div class="form-group">
        <label>Payment due (days from today)</label>
        <input type="number" name="due_days" value="30" min="0">
      </div>
    </div>

    <div class="form-group">
      <label>Notes</label>
      <textarea name="notes" rows="2" placeholder="Payment terms, project notes…"></textarea>
    </div>

    <div class="btn-group">
      <button type="submit" class="btn btn-primary">Create invoice</button>
      <a href="{{ url_for('invoices.index') }}" class="btn btn-secondary">Cancel</a>
    </div>

  </form>
</div>

{% endblock %}
