{% extends "base.html" %}
{% block title %}Settings — Punch{% endblock %}
{% block content %}

<div class="page-header">
  <div class="page-title">Settings</div>
</div>

<div class="card" style="max-width:520px;">
  <div class="card-title">Business details</div>
  <p class="text-muted text-sm mb-2">These appear on all invoices.</p>
  <form method="POST">
    {% for key, label, input_type, placeholder in fields %}
    <div class="form-group">
      <label>{{ label }}</label>
      <input type="{{ input_type }}" name="{{ key }}"
             value="{{ current.get(key, '') }}"
             placeholder="{{ placeholder }}">
    </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary">Save settings</button>
  </form>
</div>

<div class="card" style="max-width:520px;">
  <div class="card-title">Account</div>
  <a href="{{ url_for('auth.change_password') }}" class="btn btn-secondary btn-sm">Change password</a>
</div>

{% endblock %}
