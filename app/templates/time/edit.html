{% extends "base.html" %}
{% block title %}Edit Entry — Punch{% endblock %}
{% block content %}

<div class="page-header">
  <div class="page-title">Edit Time Entry</div>
  <a href="{{ url_for('clients.detail', client_id=entry.client_id) }}" class="btn btn-ghost btn-sm">← Back</a>
</div>

<div class="card">
  <form method="POST">
    <div class="form-group">
      <label>Client</label>
      <select name="client_id">
        {% for c in clients %}
        <option value="{{ c.id }}" {% if c.id == entry.client_id %}selected{% endif %}>{{ c.name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Started</label>
        <input type="datetime-local" name="started_at"
          value="{{ entry.started_at.strftime('%Y-%m-%dT%H:%M') if entry.started_at else '' }}">
      </div>
      <div class="form-group">
        <label>Ended</label>
        <input type="datetime-local" name="ended_at"
          value="{{ entry.ended_at.strftime('%Y-%m-%dT%H:%M') if entry.ended_at else '' }}">
      </div>
    </div>

    <div class="form-group">
      <label>Duration (minutes) — overrides start/end if set</label>
      <input type="number" name="duration_minutes" min="15" step="15"
        value="{{ entry.duration_minutes or '' }}" placeholder="Leave blank to calculate from times">
      <div class="form-hint">Rounded up to nearest 15 minutes automatically.</div>
    </div>

    <div class="form-group">
      <label>Description / Notes</label>
      <textarea name="description" rows="3" placeholder="Ticket #, brief description of work done…">{{ entry.description or '' }}</textarea>
    </div>

    <div class="form-group">
      <label style="display:flex;align-items:center;gap:0.5rem;text-transform:none;letter-spacing:0;">
        <input type="checkbox" name="is_billable" {% if entry.is_billable %}checked{% endif %}>
        Billable
      </label>
    </div>

    <div class="btn-group">
      <button type="submit" class="btn btn-primary">Save</button>
      <a href="{{ url_for('clients.detail', client_id=entry.client_id) }}" class="btn btn-secondary">Cancel</a>
      <form method="POST" action="{{ url_for('time.delete', entry_id=entry.id) }}"
            style="margin-left:auto;" data-confirm="Delete this time entry?">
        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
      </form>
    </div>
  </form>
</div>

{% endblock %}
