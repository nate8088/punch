{% extends "base.html" %}
{% block title %}New Entry — Punch{% endblock %}
{% block content %}

<div class="page-header">
  <div class="page-title">New Time Entry</div>
  <a href="{{ url_for('time.index') }}" class="btn btn-ghost btn-sm">← Back</a>
</div>

<div class="card">
  <form method="POST">
    <div class="form-group">
      <label>Client</label>
      <select name="client_id" required>
        <option value="">— select —</option>
        {% for c in clients %}
        <option value="{{ c.id }}" {% if preselect_client == c.id %}selected{% endif %}>{{ c.name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Date / Start time</label>
        <input type="datetime-local" name="started_at" id="started_at" value="{{ now_local }}" placeholder="MM/DD/YYYY HH:MM" required>
        <input type="hidden" name="started_at_utc" id="started_at_utc">
      </div>
      <div class="form-group">
        <label>End time (optional)</label>
        <input type="datetime-local" name="ended_at" id="ended_at">
        <input type="hidden" name="ended_at_utc" id="ended_at_utc">
      </div>
    </div>

    <div class="form-group">
      <label>Duration in hours — if no end time</label>
      <input type="number" name="duration_hours" min="0.25" step="0.25" placeholder="e.g. 2.75">
      <div class="form-hint">Rounded up to nearest 15 minutes. Use this OR an end time, not both.</div>
    </div>

    <div class="form-group">
      <label>Description / Notes</label>
      <textarea name="description" rows="3" placeholder="Ticket #, brief description…"></textarea>
    </div>

    <div class="form-group">
      <label style="display:flex;align-items:center;gap:0.5rem;text-transform:none;letter-spacing:0;">
        <input type="checkbox" name="is_billable" checked>
        Billable
      </label>
    </div>

    <div class="btn-group">
      <button type="submit" class="btn btn-primary">Add Entry</button>
      <a href="{{ url_for('time.index') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>

<script>
document.querySelector("form").addEventListener("submit", function() {
    const startVal = document.getElementById("started_at").value;
    if (startVal) {
        document.getElementById("started_at_utc").value = new Date(startVal).toISOString().slice(0, 16);
    }
    const endVal = document.getElementById("ended_at").value;
    if (endVal) {
        document.getElementById("ended_at_utc").value = new Date(endVal).toISOString().slice(0, 16);
    }
});
</script>

{% endblock %}
